name: upstream-check

# Detect a new BuffyBox RELEASE (never HEAD) and open a PR that bumps the
# packaging. A human reviews and merges; only then does COPR build it.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tooling
        run: dnf -y --setopt=install_weak_deps=False install git-core python3 gh

      - uses: actions/checkout@v4

      - name: Run release checker
        id: check
        run: python3 scripts/check-upstream.py --write

      - name: Open / update PR
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          BUFFYBOX_COMMIT: ${{ steps.check.outputs.buffybox_commit }}
          LVGL_COMMIT: ${{ steps.check.outputs.lvgl_commit }}
          LVGL_VERSION: ${{ steps.check.outputs.lvgl_version }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          git config user.name  "upstream-check[bot]"
          git config user.email "upstream-check@users.noreply.github.com"
          branch="upstream/${NEW_VERSION}"
          git checkout -B "$branch"
          git add buffybox-unl0kr.spec sources.sha256 README.md
          git commit \
            -m "Update to BuffyBox ${NEW_VERSION}" \
            -m "buffybox pinned at ${BUFFYBOX_COMMIT}; lvgl bundled at ${LVGL_COMMIT} (upstream v${LVGL_VERSION}). Generated by scripts/check-upstream.py; review before merge."
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update to BuffyBox ${NEW_VERSION}" \
            --body "Automated by the \`upstream-check\` workflow. buffybox is pinned at \`${BUFFYBOX_COMMIT}\`, verified against the tag archive's pax_global_header; the pinned sha256 sums are enforced at build time by \`scripts/fetch-sources.sh\`. \`ARCHITECTURE-SECURITY.md\` is not auto-updated - it records the previously audited revision and should be re-checked against this one. Do not merge without reviewing the diff and a green \`build\` run." \
            || echo "PR already open for ${branch}; branch updated in place."
