name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install tooling
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            git-core rpm-build rpmdevtools rpmlint dnf-plugins-core \
            ShellCheck cpio binutils systemd meson gcc curl diffutils \
            glibc-langpack-en python3
        env:
          LC_ALL: C.UTF-8

      - uses: actions/checkout@v4

      - name: Static checks (spec + shell)
        run: |
          rpmlint buffybox-unl0kr.spec | tee rpmlint-spec.txt
          shellcheck scripts/*.sh tests/*.sh dracut/module-setup.sh

      - name: Unit tests (upstream-check, offline)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Cache upstream tarballs
        uses: actions/cache@v4
        with:
          path: srccache
          key: src-${{ hashFiles('sources.sha256') }}

      - name: Fetch + verify pinned sources
        run: |
          mkdir -p srccache
          scripts/fetch-sources.sh "$PWD/srccache"

      - name: rpmdev tree + stage sources
        run: |
          rpmdev-setuptree
          top=$(rpmbuild --eval %_topdir)
          cp srccache/*.tar.gz "$top/SOURCES/"
          cp ARCHITECTURE-SECURITY.md "$top/SOURCES/"
          cp dracut/module-setup.sh "$top/SOURCES/"
          [ -d patches ] && cp patches/*.patch "$top/SOURCES/"
          cp buffybox-unl0kr.spec "$top/SPECS/"
          echo "TOPDIR=$top" >> "$GITHUB_ENV"

      - name: dnf builddep (BuildRequires completeness)
        run: dnf -y builddep "$TOPDIR/SPECS/buffybox-unl0kr.spec"

      - name: Build SRPM + RPMs
        run: |
          rpmbuild -bs "$TOPDIR/SPECS/buffybox-unl0kr.spec"
          rpmbuild --rebuild "$TOPDIR"/SRPMS/buffybox-unl0kr-*.src.rpm
          mkdir -p build/SRPMS build/RPMS
          cp "$TOPDIR"/SRPMS/*.src.rpm build/SRPMS/
          find "$TOPDIR/RPMS" -name '*.rpm' -exec cp {} build/RPMS/ \;
          ls -R build

      - name: Validate produced RPMs
        run: tests/validate-rpms.sh "$PWD/build/RPMS" "$PWD/build/SRPMS"

      - name: Test dracut initramfs composition
        run: tests/test-dracut-image.sh "$PWD/build/RPMS"

      - name: rpmlint on built packages
        run: |
          rpmlint -r ci/rpmlintrc \
            build/SRPMS/*.src.rpm build/RPMS/*.rpm | tee rpmlint-built.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: |
            build/SRPMS/*.src.rpm
            build/RPMS/*.rpm
            rpmlint-*.txt

  bazzite-bootc-test:
    needs: rpm
    runs-on: ubuntu-26.04
    steps:
      - name: Maximize build disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - uses: actions/checkout@v4

      - name: Install required host tooling
        run: |
          missing_tools=()
          for tool in skopeo jq podman; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing_tools+=("$tool")
            fi
          done
          if [ "${#missing_tools[@]}" -gt 0 ]; then
            echo "Installing missing host tools: ${missing_tools[*]}"
            sudo apt-get update
            sudo apt-get install -y "${missing_tools[@]}"
          fi

      - name: Tool versions and disk space (pre-build)
        run: |
          podman --version
          skopeo --version
          df -h

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpms
          path: staging-rpms

      - name: Stage runtime RPMs
        run: |
          mkdir -p target-rpms
          echo "Contents of staging-rpms:"
          find staging-rpms -maxdepth 3 -ls || true

          for pkg in unl0kr unl0kr-agent unl0kr-dracut; do
            matches=()
            while IFS= read -r -d '' f; do
              case "$(basename "$f")" in
                *-debuginfo-*|*-debugsource-*) continue ;;
                *) matches+=("$f") ;;
              esac
            done < <(find staging-rpms -type f -name "${pkg}-[0-9]*.rpm" -print0)

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Error: expected exactly 1 match for ${pkg}-[0-9]*.rpm, found ${#matches[@]}: ${matches[*]:-none}" >&2
              exit 1
            fi
            echo "Selected ${pkg}: ${matches[0]}"
            cp "${matches[0]}" target-rpms/
          done

          echo "Staged runtime RPMs in target-rpms/:"
          ls -la target-rpms/

          count=$(find target-rpms -maxdepth 1 -name '*.rpm' | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "Error: expected exactly 3 RPMs staged, found $count" >&2
            exit 1
          fi

      - name: Build Bazzite derived image and run container smoke test
        uses: jaredbartimus/bootc-test-harness@1ae068962c77815607cc59d1264147e2573e9950
        with:
          base-image: ghcr.io/ublue-os/bazzite-deck:stable
          rpms-dir: target-rpms
          test-script: tests/test-dracut-bazzite.sh
          test-args: /tmp/work

      - name: Disk space (post-build)
        if: always()
        run: df -h
